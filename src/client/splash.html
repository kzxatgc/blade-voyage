<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blade Voyage</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="splash">
      <button
        class="chest-start"
        id="chest-start"
        type="button"
        aria-label="Open the chest to start Blade Voyage"
        disabled
      >
        <canvas
          class="chest-prompt"
          id="chest-prompt"
          aria-hidden="true"
        ></canvas>
        <img
          class="chest-sprite"
          id="chest-sprite"
          src="/assets/img/ui/splash/chest/idle.png"
          alt=""
          draggable="false"
        />
      </button>
      <p class="splash-status" id="splash-status" aria-live="polite"></p>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
